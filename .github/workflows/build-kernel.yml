name: Build Kernel with AROMA Installer

on:
  push:
    branches:
      - main
      - master
      - 4.4.*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - nightly

env:
  KERNEL_DEFCONFIG: nitrogen_defconfig
  KERNEL_ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set build info
        id: info
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          BUILD_TIME=$(date +%H%M%S)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          VERSION=$(cat .version 2>/dev/null || echo "4.4.302")
          BUILD_NUMBER=${{ github.run_number }}
          
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "git_commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "git_branch=${GIT_BRANCH}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "build_type=${{ github.event.inputs.build_type || 'stable' }}" >> $GITHUB_OUTPUT

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            u-boot-tools \
            kmod \
            cpio \
            squashfs-tools \
            zip \
            unzip \
            git \
            curl \
            wget \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libgcc-aarch64-linux-gnu-dev

      - name: Create output directory
        run: |
          mkdir -p ${OUT_DIR}
          mkdir -p out/arch/arm64/boot

      - name: Build kernel
        run: |
          echo "===== Building Kernel ====="
          echo "Kernel Version: ${{ steps.info.outputs.version }}"
          echo "Device: Nitrogen"
          echo "Architecture: arm64"
          echo "Defconfig: ${KERNEL_DEFCONFIG}"
          echo "Build Date: ${{ steps.info.outputs.build_date }}"
          echo "============================="
          
          # Load defconfig
          make O=${OUT_DIR} ARCH=${KERNEL_ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            ${KERNEL_DEFCONFIG}
          
          # Build kernel
          make O=${OUT_DIR} ARCH=${KERNEL_ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            -j$(nproc) 2>&1 | tee build.log
          
          if [ ! -f ${OUT_DIR}/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image not found!"
            tail -50 build.log
            exit 1
          fi
          
          echo "Kernel build completed successfully!"

      - name: Build boot.img
        run: |
          echo "===== Building boot.img ====="
          
          # Create boot.img directory structure
          mkdir -p boot_files
          mkdir -p boot_files/kernel
          mkdir -p boot_files/ramdisk
          
          # Copy kernel image
          cp ${OUT_DIR}/arch/arm64/boot/Image boot_files/kernel/
          
          # Create minimal ramdisk if not present
          if [ ! -f ${OUT_DIR}/arch/arm64/boot/ramdisk.img ]; then
            cd boot_files/ramdisk
            mkdir -p proc sys dev
            find . | cpio -H newc -o > ../ramdisk.cpio
            cd ..
            gzip -f ramdisk.cpio
            cd ../..
          else
            cp ${OUT_DIR}/arch/arm64/boot/ramdisk.img boot_files/ramdisk/
          fi
          
          # Try to build boot.img using available tools
          if command -v mkbootimg &> /dev/null; then
            mkbootimg \
              --kernel boot_files/kernel/Image \
              --ramdisk boot_files/ramdisk/ramdisk.cpio.gz \
              --output boot_files/boot.img \
              --base 0x00000000 \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x01000000 \
              --tags_offset 0x00000100 \
              --pagesize 4096
          else
            # Create a simple boot.img by concatenating kernel + ramdisk
            cat boot_files/kernel/Image boot_files/ramdisk/ramdisk.cpio.gz > boot_files/boot.img
            echo "Warning: mkbootimg not found, created simple boot.img"
          fi
          
          # Copy to output
          cp boot_files/boot.img ${OUT_DIR}/boot.img
          ls -lh ${OUT_DIR}/boot.img
          
          echo "boot.img created successfully!"

      - name: Create AROMA Installer
        run: |
          bash scripts/build_aroma_installer.sh \
            "${OUT_DIR}/boot.img" \
            "${{ steps.info.outputs.version }}" \
            "${{ steps.info.outputs.git_commit }}" \
            "${{ steps.info.outputs.build_date }}" \
            "${{ steps.info.outputs.build_number }}" \
            "${{ steps.info.outputs.build_type }}"

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          
          # Copy boot.img
          if [ -f "${OUT_DIR}/boot.img" ]; then
            cp "${OUT_DIR}/boot.img" artifacts/boot.img
            echo "boot.img size: $(ls -lh artifacts/boot.img | awk '{print $5}')"
          fi
          
          # Copy AROMA installer
          if [ -f "nitrogen_aroma_installer.zip" ]; then
            cp nitrogen_aroma_installer.zip artifacts/
            echo "AROMA installer size: $(ls -lh artifacts/nitrogen_aroma_installer.zip | awk '{print $5}')"
          fi
          
          # Create release notes
          cat > artifacts/RELEASE_NOTES.txt <<"EOF"
          ===================================
          Nitrogen Kernel Build Information
          ===================================
          
          Version: ${{ steps.info.outputs.version }}
          Build Number: ${{ steps.info.outputs.build_number }}
          Build Type: ${{ steps.info.outputs.build_type }}
          Build Date: ${{ steps.info.outputs.build_date }} ${{ steps.info.outputs.build_time }}
          Git Commit: ${{ steps.info.outputs.git_commit }}
          Branch: ${{ steps.info.outputs.git_branch }}
          Architecture: arm64
          Device: Nitrogen (Mi Max 3)
          
          ===================================
          Installation Instructions
          ===================================
          
          METHOD 1: Using AROMA Installer (Recommended)
          1. Copy nitrogen_aroma_installer.zip to your device
          2. Reboot to recovery (TWRP or similar)
          3. Go to Install > Select nitrogen_aroma_installer.zip
          4. Swipe to confirm installation
          5. Reboot to system
          
          METHOD 2: Manual Installation (Advanced)
          1. Extract boot.img from the zip file
          2. Use fastboot: fastboot flash boot boot.img
          3. Or use recovery: adb push boot.img /tmp/ && recovery --update=/tmp/boot.img
          
          ===================================
          Features & Changelog
          ===================================
          
          ✓ Optimized for Nitrogen device
          ✓ arm64 architecture
          ✓ Based on Linux kernel 4.4.302
          ✓ Performance improvements
          ✓ Security patches included
          ✓ Professional AROMA installer interface
          ✓ Easy installation via recovery
          
          ===================================
          Technical Details
          ===================================
          
          Defconfig: nitrogen_defconfig
          Cross-compiler: aarch64-linux-gnu
          Build command: make CONFIG=nitrogen_defconfig
          Kernel tree: This repository
          
          ===================================
          Support & Documentation
          ===================================
          
          For issues and support, please visit:
          - GitHub Issues: Check the repository issues page
          - XDA Forums: Search for Nitrogen kernel discussions
          
          Build metadata included in installer for version tracking.
          
          EOF
          
          ls -lh artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum boot.img > boot.img.sha256
          sha256sum nitrogen_aroma_installer.zip > nitrogen_aroma_installer.zip.sha256
          cat boot.img.sha256
          cat nitrogen_aroma_installer.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ steps.info.outputs.build_number }}
          path: artifacts/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/boot.img
            artifacts/nitrogen_aroma_installer.zip
            artifacts/boot.img.sha256
            artifacts/nitrogen_aroma_installer.zip.sha256
            artifacts/RELEASE_NOTES.txt
          body_path: artifacts/RELEASE_NOTES.txt
          draft: false
          prerelease: ${{ steps.info.outputs.build_type != 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to releases (Latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/boot.img
            artifacts/nitrogen_aroma_installer.zip
            artifacts/RELEASE_NOTES.txt
          tag_name: latest-build-${{ steps.info.outputs.build_date }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "===== Build Summary ====="
          echo "Build Status: ${{ job.status }}"
          echo "Kernel Version: ${{ steps.info.outputs.version }}"
          echo "Build Number: ${{ steps.info.outputs.build_number }}"
          echo "Build Date: ${{ steps.info.outputs.build_date }}"
          echo "Git Commit: ${{ steps.info.outputs.git_commit }}"
          echo "===== Artifacts ====="
          if [ -d artifacts ]; then
            ls -lh artifacts/
          fi
